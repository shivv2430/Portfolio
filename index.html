<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem('color-scheme');
        document.querySelector('meta[name="color-scheme"]').content = stored || 'light dark';
        if (stored === 'dark') document.documentElement.classList.add('dark');
        else if (stored === 'light') document.documentElement.classList.remove('dark');
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Shivani Pal | Developer Portfolio</title>
    <meta name="description" content="Shivani Pal: BTech student, web developer, and lifelong learner passionate about building meaningful digital experiences." />
    <meta name="keywords" content="Shivani Pal, developer, portfolio, React, web development, ELCE, BTech" />
    <meta property="og:title" content="Shivani Pal | Developer Portfolio" />
    <meta property="og:description" content="Turning Curiosity Into Code and Ideas Into Reality." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
